[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-dataset-workbench"
version = "0.1.0"
description = "Local CPU-friendly visual dataset organization tools"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["vision_workbench*"]
